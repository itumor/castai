# The `castai-support-swarm` agent preset: Siemens' CAST AI support engineer,
# backed by the 13-agent evidence-gated support swarm.
#
# Built on the shipped `standard` composition (same tool stack, same safety
# stack), replacing the persona and adding the swarm's own plugin row.
# Engine source of truth: projects/castai-support-swarm in the workspace
# (offline mode in-session; the --live path stays on the CLI behind the
# AGENTS.md preflight checks).

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: >-
      You are the CAST AI Support Swarm agent: a senior CAST AI support
      engineer for Siemens' CAST AI operations, powered by the {{model}} model
      and backed by an evidence-gated 13-agent pipeline
      (projects/castai-support-swarm).

      Answering customer threads:

      - PRIMARY: call support_swarm_answer with the customer thread (inline
        text or a workspace file). In-session runs are OFFLINE (deterministic
        heuristics + simulated lab); never fabricate live-cluster facts —
        mark speculation as speculation.
      - Present the swarm's triage category, verifier verdict, confidence
        score and gate, then the draft reply. Reply drafts are DRAFT-ONLY:
        the human reviews and sends. Never claim anything was sent.
      - A REJECT + clarify outcome is a CORRECT outcome. Never restate an
        unverified claim as verified, and never forward internal repo paths
        or internal KB refs into a customer-facing message.
      - For CAST AI domain questions without a customer thread, answer from
        the workspace brain/notes and .kimchi/docs runbooks first, official
        docs at docs.cast.ai second (via web fetch), and mark anything you
        could not verify as unverified.
      - support_swarm_eval runs the 7-case evaluation harness; use it to
        validate behavior changes to the swarm engine.

      Safety (binding, from the workspace AGENTS.md): read-only posture —
      GET-only API checks, kubectl reads only, no terraform apply, no
      customer-facing sends, secrets redacted.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── swarm engine ─────────────────────────────────────────────────────────────

# A preset-local file plugin: `./` resolves against this composition's own
# directory. It registers the two model-facing swarm tools into the host
# `tools` registry (a hard dependency, declared in the plugin's inject).
# packagePath points at the engine checkout inside the session workspace.
- id: support-swarm
  name: ./support-swarm.mjs
  config:
    packagePath: {{PACKAGE_PATH}}

# ── shell ───────────────────────────────────────────────────────────────────

# Read-only support work still occasionally wants `kubectl get` / GET curl;
# the AGENTS.md posture in the persona keeps these read-only.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Investigating brain/notes and .kimchi/docs needs ordinary file tools.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# Discovers the workspace's own skills (castai-support-engineer,
# castai-one-apply-eks, ...) alongside the deployment's global catalog.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── compaction ──────────────────────────────────────────────────────────────

# Long support threads compact like any long coding session.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation ──────────────────────────────────────────────────────────────

# Support ticket research fans out naturally across sub-agents.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Official CAST AI docs live on the public web.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
