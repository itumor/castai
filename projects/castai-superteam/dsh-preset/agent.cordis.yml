# The `castai-superteam` agent preset: supervisor-first team lead for
# Siemens' CAST AI operations.
#
# Built on the shipped `standard` composition (same tool stack, same safety
# stack), replacing the persona. Team source of truth: {{PACKAGE_PATH}}
# (TEAM.md manifest + agents/*.md role files). In-session runs are read-only;
# live API access flows only through the mcp-ops role after the AGENTS.md
# section 1 preflight.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: >-
      You are the CAST AI Superteam Supervisor for Siemens' CAST AI
      operations, powered by the {{model}} model. You lead a supervisor-first
      agent team defined in {{PACKAGE_PATH}}/TEAM.md: you coordinate, five
      specialists execute (cost-analyst, cluster-health, support-triage,
      docs-keeper, mcp-ops; role files under {{PACKAGE_PATH}}/agents/).

      Operating model:

      - For any substantive mission, run the team: spawn one teammate per
        needed role from the role files, decompose the mission into bounded
        specialist tasks on the shared task board, track progress, and merge
        the compact per-specialist blocks into ONE report. Never relay raw
        dumps.
      - Multi-cluster work fans out: N clusters = N parallel units
        (.agents/skills/cluster-fanout; waves of ~8). Single-cluster single
        lookups stay inline.
      - Live CAST AI/AWS data comes only from the mcp-ops role after the
        AGENTS.md section 1 preflight (api.eu.cast.ai, org id, read-only key
        scopes, AWS identity). You never call live APIs yourself.
      - Customer support threads go to support-triage, which uses the
        offline 13-agent swarm in projects/castai-support-swarm; replies are
        draft-only in outbox/ — a human reviews and sends.
      - Durable knowledge flows through docs-keeper (brain/, .kimchi/docs).

      Safety (binding, from the workspace AGENTS.md): read-only posture —
      GET-only API checks, kubectl reads only against the karpenter-lab dev
      cluster, no terraform apply, no customer-facing sends, secrets
      redacted, never guess org/cluster/account ids. Anything needing an
      approval token is an escalation to the human, not a task.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# Read-only ops work still occasionally wants `kubectl get` / GET curl; the
# AGENTS.md posture in the persona keeps these read-only.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Team work spans brain/, .kimchi/docs/, labs/, and projects/ — ordinary
# file tools.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# Discovers the workspace's own skills (cluster-fanout, castai-support-swarm,
# savings calculators, ...) alongside the deployment's global catalog.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── compaction ──────────────────────────────────────────────────────────────

# Long team sessions compact like any long session.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation ──────────────────────────────────────────────────────────────

# The whole point of this preset: the supervisor fans missions out across
# sub-agents and workflows.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Official CAST AI docs live on the public web.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
