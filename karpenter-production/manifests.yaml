# Karpenter production manifests for karpenter-lab.
#
# Rendered via `envsubst` from deploy.sh. Placeholders:
#   ${CLUSTER_NAME}            EKS cluster name (karpenter-lab)
#   ${AWS_REGION}              AWS region (eu-central-1)
#   ${AL2023_AMI_VERSION}      Pinned AL2023 AMI version (e.g. v20240729)
#
# Apply AFTER the Karpenter Helm release is installed:
#   kubectl apply -f manifests.rendered.yaml
#
# AWS EBS CSI driver addon must already be installed on the cluster (the addon
# is managed by EKS; this manifest only declares the default StorageClass).
#
# Contents:
#   1. EC2NodeClass `general` - production-grade, IMDSv2, encrypted gp3,
#      subnet/SG discovery via karpenter.sh/discovery tag.
#   2. NodePool `general` - Spot-first with On-Demand fallback, broad
#      instance flexibility, topology spread hint via capacity-spread.
#   3. NodePool `critical-on-demand` - On-Demand only, NoSchedule taint for
#      workloads that cannot tolerate Spot interruption.
#   4. api Deployment (nginx), Service, PDB, HPA, topology spread.
#   5. Optional critical workload (api-critical) using critical-on-demand.
---
# Default StorageClass for the cluster. Requires the aws-ebs-csi-driver addon.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: general
  annotations:
    kubernetes.io/description: "Production EC2NodeClass for karpenter-lab general workloads"
spec:
  # IAM role assumed by Karpenter-managed nodes (instance profile).
  role: "eksctl-KarpenterNodeRole-${CLUSTER_NAME}"

  # Discover subnets and security groups by the eksctl-applied tag.
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"

  # Pinned AL2023 EKS-optimized AMI. Replace @latest with the version
  # discovered by deploy.sh via AWS SSM/EC2 describe-images.
  amiFamily: AL2023
  amiSelectorTerms:
    - id: "${AL2023_AMI_VERSION}"

  # IMDSv2 enforced.
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required

  # Encrypted gp3 root volume.
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true

  # No detailed monitoring - keep lab cost low. Flip to true in prod if needed.
  detailedMonitoring: false

  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="BOUNDARY"

    --BOUNDARY
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash
    # Ensure IMDSv2 (defense in depth even though metadataOptions enforces it).
    aws configure set default.ec2_metadata_service_imds_version v2 || true

    --BOUNDARY--
---
# CLM-specific EC2NodeClass. Restricts provisioning to the private subnet in
# a single AZ so that all CLM nodes share the same subnet. CLM TCP live
# migration requires source and destination nodes to be in the same subnet.
# Private subnets are also preferred for workload nodes.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: general-live
  annotations:
    kubernetes.io/description: "Private-subnet EC2NodeClass for CLM-enabled nodes"
spec:
  role: "eksctl-KarpenterNodeRole-${CLUSTER_NAME}"

  subnetSelectorTerms:
    - id: "${CLM_PRIVATE_SUBNET_ID}"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"

  amiFamily: AL2023
  amiSelectorTerms:
    - id: "${AL2023_AMI_VERSION}"

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true

  detailedMonitoring: false

  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="BOUNDARY"

    --BOUNDARY
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash
    aws configure set default.ec2_metadata_service_imds_version v2 || true

    --BOUNDARY--
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
  annotations:
    kubernetes.io/description: "Spot-first, flexible general workloads"
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

        # Spot-first with On-Demand fallback. Karpenter prefers Spot when
        # available and falls back to On-Demand automatically.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]

        # Broad, flexible instance selection for cost optimization.
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "m", "c", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]

        # AZ spread preference. Karpenter respects topology spread constraints
        # defined on pods.
        - key: topology.kubernetes.io/zone
          operator: Exists

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: general

      # Expire nodes after 7 days so they roll over to new instance types
      # as Spot prices change.
      expireAfter: 168h

  # Safety limits for the lab.
  limits:
    cpu: "40"
    memory: 160Gi

  # Cost optimization: consolidate empty/underutilized nodes aggressively.
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s

  weight: 100
  # No taints: general workloads should schedule freely on these nodes.
---
# CLM-enabled NodePool for CAST AI Container Live Migration.
# - AL2023 EC2NodeClass (already required)
# - live.cast.ai/install label for CLM daemonset
# - startupTaint so pods wait until CLM is ready
# - Single AZ (IPs cannot migrate across AZs)
# - CLM-compatible instance families selected by user
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general-live
  annotations:
    kubernetes.io/description: "CLM-enabled NodePool for live-migratable workloads"
spec:
  template:
    metadata:
      labels:
        live.cast.ai/install: "true"
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

        # Use On-Demand for stable ENIs during live migration.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        # CLM-compatible families selected in the CAST AI UI.
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c3", "m3", "r3", "i2"]

        # Pin to a single AZ because IPs cannot migrate across AZs.
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["us-west-2a"]

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: general-live

      # CLM readiness taint: Karpenter waits for CLM signal before scheduling.
      startupTaints:
        - key: live.cast.ai/not-ready
          value: "true"
          effect: NoSchedule

      expireAfter: 720h

  limits:
    cpu: "20"
    memory: 80Gi

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m

  weight: 80
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: critical-on-demand
  annotations:
    kubernetes.io/description: "On-Demand only for workloads that cannot tolerate Spot"
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

        # On-Demand only.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        # Predictable instance family for critical workloads.
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "c", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gte
          values: ["5"]

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: general

      # Hard isolation: NoSchedule taint - only pods that explicitly tolerate
      # this taint land here.
      taints:
        - key: workload-type
          value: critical
          effect: NoSchedule

      expireAfter: 720h

  limits:
    cpu: "20"
    memory: 80Gi

  # Critical workloads should NOT be consolidated aggressively; only empty.
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m

  weight: 50
---
# Sample general workload: nginx api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Force this workload onto the general NodePool via capacity-type
      # requirement. We do NOT set nodeSelector or taint tolerations so
      # Karpenter can place pods on freshly-spun Spot nodes.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api
      containers:
        - name: nginx
          image: public.ecr.aws/nginx/nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
# CLM workload example. Schedules on the CLM-enabled NodePool, tolerates the
# startup taint, and avoids a hard cross-zone topology spread because the
# NodePool is pinned to a single AZ.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-live
  labels:
    app: api-live
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-live
  template:
    metadata:
      labels:
        app: api-live
    spec:
      nodeSelector:
        karpenter.sh/nodepool: general-live
      tolerations:
        - key: live.cast.ai/not-ready
          operator: Exists
          effect: NoSchedule
      # No hard zone spread; NodePool is single-AZ.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: api-live
      containers:
        - name: nginx
          image: public.ecr.aws/nginx/nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Optional critical workload. Tolerates the workload-type=critical:NoSchedule
# taint so it lands on the critical-on-demand NodePool.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-critical
  labels:
    app: api-critical
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-critical
  template:
    metadata:
      labels:
        app: api-critical
    spec:
      tolerations:
        - key: workload-type
          value: critical
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: api-critical
      containers:
        - name: nginx
          image: public.ecr.aws/nginx/nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
